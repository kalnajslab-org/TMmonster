[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmmonster"
version = "2.4.2"
description = "Decode LASP-Strateole2 Telemetry Messages."
readme = "README.md"
authors = [
    { name = "LASP Strateole2 Team" }
]
requires-python = ">=3.9"
dependencies = [
    "bitstruct",
    "xmltodict",
    "numpy"
]

[project.scripts]
tmmonster = "tmmonster.cli:cli_main"
tmmonster-batch = "tmmonster.batch:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
